<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Archive</title>
<style>
  :root {
    --ink: #0d1f0a;
    --glow: #d9e87a;
    --glow-dim: #8fae4a;
    --panel-bg: rgba(8, 16, 6, 0.88);
    --panel-border: rgba(217, 232, 122, 0.25);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #050a04;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28"><circle cx="14" cy="14" r="3" fill="%23d9e87a"/><circle cx="14" cy="14" r="9" fill="none" stroke="%23d9e87a" stroke-width="1" opacity="0.6"/></svg>') 14 14, auto;
  }

  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #050a04;
  }

  .scene {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: none;
  }

  .scene.active { display: block; }

  .scene img.bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    user-select: none;
    -webkit-user-drag: none;
    filter: brightness(1.0);
    transition: filter 0.3s ease;
  }

  .hotspot {
    position: absolute;
    cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><circle cx="16" cy="16" r="4" fill="%23f4ffb8"/><circle cx="16" cy="16" r="12" fill="none" stroke="%23f4ffb8" stroke-width="1.5"/><circle cx="16" cy="16" r="12" fill="none" stroke="%23f4ffb8" stroke-width="0.5" opacity="0.4"><animate attributeName="r" values="12;16;12" dur="1.6s" repeatCount="indefinite"/></circle></svg>') 16 16, pointer;
    z-index: 5;
  }

  .hotspot.door {
    animation: pulse-door 2.6s ease-in-out infinite;
  }

  @keyframes pulse-door {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.35); }
  }

  /* visible debug rectangle - remove or keep faint for production */
  .hotspot::after {
    content: '';
    position: absolute;
    inset: 0;
  }

  /* Birds overlay: decorative only, never intercepts clicks, sits above the
     background art but below hotspots/UI. Position/size it to taste. */
  .birds-overlay {
    position: absolute;
    top: 2%;
    left: 45%;
    width: 55%;
    height: auto;
    z-index: 4;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
    opacity: 0.8;
  }

  .birds-overlay.paused {
    opacity: 0;
  }

  /* Bottom text box */
  #textbox {
    position: absolute;
    left: 50%;
    bottom: 36px;
    transform: translateX(-50%) translateY(12px);
    width: min(720px, 86vw);
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 22px 26px;
    color: var(--glow);
    font-size: 15px;
    line-height: 1.6;
    letter-spacing: 0.02em;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease, transform 0.35s ease;
    z-index: 45;
    backdrop-filter: blur(2px);
  }

  #textbox.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
    pointer-events: auto;
  }

  #textbox .label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--glow-dim);
    margin-bottom: 8px;
  }

  #textbox .close-hint {
    display: block;
    margin-top: 14px;
    font-size: 10px;
    color: var(--glow-dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.7;
  }

  /* Intro hint */
  #hint {
    position: absolute;
    top: 36px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--glow-dim);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.8;
    z-index: 15;
    text-align: center;
    transition: opacity 0.6s ease;
  }

  #hint.hidden { opacity: 0; }

  /* fine grain overlay to match the dithered art style */
  #grain {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 30;
    opacity: 0.05;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/></filter><rect width="100" height="100" filter="url(%23n)"/></svg>');
    mix-blend-mode: overlay;
  }

  @media (max-width: 640px) {
    #textbox { font-size: 13px; padding: 16px 18px; bottom: 20px; width: 92vw; }
    #hint { font-size: 9px; top: 20px; }
  }

  /* Darkening / blur overlay shown behind the zoomed paper */
  #scrim {
    position: absolute;
    inset: 0;
    z-index: 25;
    background: rgba(2, 6, 2, 0);
    backdrop-filter: blur(0px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.45s ease, backdrop-filter 0.45s ease;
  }

  #scrim.visible {
    background: rgba(2, 6, 2, 0.55);
    backdrop-filter: blur(6px);
    opacity: 1;
    pointer-events: auto;
  }

  /* The small paper, pinned to a spot on the wall */
  .paper-hotspot {
    position: absolute;
    cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><circle cx="16" cy="16" r="4" fill="%23f4ffb8"/><circle cx="16" cy="16" r="12" fill="none" stroke="%23f4ffb8" stroke-width="1.5"/></svg>') 16 16, pointer;
    z-index: 6;
    transition: left 0.5s cubic-bezier(.4,0,.2,1), top 0.5s cubic-bezier(.4,0,.2,1),
                width 0.5s cubic-bezier(.4,0,.2,1), filter 0.4s ease;
    filter: drop-shadow(0 0 6px rgba(217,232,122,0.25));
  }

  .paper-hotspot img {
    display: block;
    width: 100%;
    height: auto;
    user-select: none;
    -webkit-user-drag: none;
  }

  .paper-hotspot:hover {
    filter: drop-shadow(0 0 12px rgba(217,232,122,0.5));
  }

  /* Zoomed state: centered, large, no longer clickable to re-trigger zoom-in */
  .paper-hotspot.zoomed {
    left: 50% !important;
    top: 50% !important;
    width: min(360px, 70vw) !important;
    transform: translate(-50%, -50%);
    z-index: 40;
    cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28"><circle cx="14" cy="14" r="3" fill="%23d9e87a"/><circle cx="14" cy="14" r="9" fill="none" stroke="%23d9e87a" stroke-width="1" opacity="0.6"/></svg>') 14 14, auto;
    filter: drop-shadow(0 8px 24px rgba(0,0,0,0.6));
  }

  .paper-hotspot:not(.zoomed) {
    transform: translate(0, 0);
  }

  @media (max-width: 640px) {
    .paper-hotspot.zoomed { width: min(280px, 78vw) !important; }
  }
</style>
</head>
<body>

<div id="stage">

  <audio id="ambient" src="audio/waves.mp3" loop preload="auto"></audio>

  <!-- SCENE 1: Entrance -->
  <div class="scene active" data-scene="entrance">
    <img class="bg" src="images/01.png" alt="A distant structure on a ridge, a sliver of light within it">

    <!-- Decorative birds overlay: not clickable, sits above the art, below hotspots -->
    <img class="birds-overlay" id="birdsOverlay" src="images/birds.gif" alt="" aria-hidden="true" draggable="false">

    <div class="hotspot door" data-target="path"
         style="left: 29.5%; top: 35.5%; width: 8.5%; height: 23%;"
         onclick="goToScene('path')"></div>
  </div>

  <!-- SCENE 2: Path -->
  <div class="scene" data-scene="path">
    <img class="bg" src="images/02.png" alt="Closer now, the doorway of light fills the frame">
    <div class="hotspot door" data-target="final"
         style="left: 39.7%; top: 18.8%; width: 15.9%; height: 48%;"
         onclick="goToScene('final')"></div>
  </div>

  <!-- SCENE 3: Final room -->
  <div class="scene" data-scene="final">
    <img class="bg" src="images/03.png" alt="Inside the light, a corridor of pale green leading inward">

    <div class="paper-hotspot" id="paper" style="left: 46%; top: 32%; width: 8%;" onclick="openPaper(event)">
      <img src="images/paper.png" alt="A small folded paper pinned to the wall">
    </div>
  </div>

  <div id="scrim" onclick="closePaper()"></div>

  <div id="hint">left-click to go forward · right-click to go back</div>

  <div id="textbox">
    <span id="textbox-content"></span>
  </div>

  <div id="grain"></div>
</div>

<script>
  let audioStarted = false;
  function startAmbience() {
    if (audioStarted) return;
    audioStarted = true;
    const ambient = document.getElementById('ambient');
    ambient.volume = 0.4;
    ambient.play().catch(() => {});
  }
  document.getElementById('stage').addEventListener('click', startAmbience, { once: true });

  // ---- Birds overlay loop-with-pause ----
  // The gif itself is one long flight (~55s). Instead of letting it snap
  // straight back to frame 1 forever, we fade it out once it finishes,
  // wait a bit, then fade a fresh copy back in. Purely decorative:
  // pointer-events is off in CSS so it never intercepts hotspot clicks.
  (function birdsLoop() {
    const birds = document.getElementById('birdsOverlay');
    if (!birds) return;

    const originalSrc = birds.getAttribute('src');
    const FLIGHT_DURATION = 16300; // ms - matches the gif's own loop length
    const PAUSE_DURATION = 10000;  // ms - empty-sky gap between flights, tweak to taste

    function cycle() {
      // start a fresh flight (cache-bust so the gif restarts at frame 1)
      birds.classList.remove('paused');
      birds.src = originalSrc + '?t=' + Date.now();

      setTimeout(() => {
        // flight's over: fade out and hold on empty sky
        birds.classList.add('paused');
        setTimeout(cycle, PAUSE_DURATION);
      }, FLIGHT_DURATION);
    }

    cycle();
  })();

  // Defines what right-click steps back to from each scene. Edit this if you add more scenes.
  const previousScene = {
    entrance: null,   // already at the start, nothing to go back to
    path: 'entrance',
    final: 'path'
  };

  let currentScene = 'entrance';

  function goToScene(name) {
    document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
    document.querySelector(`.scene[data-scene="${name}"]`).classList.add('active');
    currentScene = name;
    hideText();
    const hint = document.getElementById('hint');
    if (name === 'final') {
      hint.textContent = 'click to examine';
      hint.classList.remove('hidden');
      setTimeout(() => hint.classList.add('hidden'), 2600);
    } else {
      hint.classList.add('hidden');
    }
  }

  function goBack() {
  const target = previousScene[currentScene];
  if (target) {
    goToScene(target);
  } else {
    window.location.href = '../index.html';
  }
}

  function showText(id, el) {
    const box = document.getElementById('textbox');
    const content = document.getElementById('textbox-content');
    content.textContent = (typeof stories !== 'undefined' && stories[id]) ? stories[id] : '';
    box.classList.add('visible');
    if (el) el.classList.add('found');
  }

  function hideText() {
    document.getElementById('textbox').classList.remove('visible');
  }

  const paperMessage = "THIS ARCHIVE IS NOT HERE. WHAT RIGHT DO YOU HAVE TO FIND IT";

  function openPaper(e) {
    e.stopPropagation();
    localStorage.setItem('level-1-complete', 'true');
    const paper = document.getElementById('paper');
    if (paper.classList.contains('zoomed')) return; // already open, let scrim handle closing
    paper.classList.add('zoomed');
    document.getElementById('scrim').classList.add('visible');
    document.getElementById('textbox-content').textContent = paperMessage;
    document.getElementById('textbox').classList.add('visible');
  }

  function closePaper() {
    document.getElementById('paper').classList.remove('zoomed');
    document.getElementById('scrim').classList.remove('visible');
    hideText();
  }

  document.getElementById('stage').addEventListener('click', (e) => {
    if (document.getElementById('paper').classList.contains('zoomed')) return; // scrim click handles this
    if (e.target.closest('.hotspot') || e.target.closest('.paper-hotspot')) return;
    if (e.target.closest('#textbox')) { hideText(); return; }
    hideText();
  });

  // Right-click anywhere on the stage steps back one scene, instead of showing the browser menu.
  document.getElementById('stage').addEventListener('contextmenu', (e) => {
    e.preventDefault();
    if (document.getElementById('paper').classList.contains('zoomed')) {
      closePaper();
      return;
    }
    goBack();
  });

  // initial hint fade
  setTimeout(() => document.getElementById('hint').classList.add('hidden'), 3200);
</script>

</body>
</html>
