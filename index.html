<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find the Archive</title>
<style>
  :root {
    --glow: #d9e87a;
    --glow-dim: #6f8a3c;
    --panel-border: rgba(217, 232, 122, 0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    min-height: 100%;
    background: #000;
    font-family: 'Courier New', monospace;
    color: var(--glow);
    cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28"><circle cx="14" cy="14" r="3" fill="%23d9e87a"/><circle cx="14" cy="14" r="9" fill="none" stroke="%23d9e87a" stroke-width="1" opacity="0.6"/></svg>') 14 14, auto;
  }

  .level-card, .level-card * {
    cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28"><circle cx="14" cy="14" r="3" fill="%23d9e87a"/><circle cx="14" cy="14" r="9" fill="none" stroke="%23d9e87a" stroke-width="1" opacity="0.6"/></svg>') 14 14, auto;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 60px 24px;
  }

  h1 {
    font-size: 18px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    font-weight: 400;
    color: var(--glow-dim);
    margin-bottom: 56px;
    text-align: center;
  }

  .levels {
    display: flex;
    gap: 36px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .level-card {
    position: relative;
    width: 320px;
    text-decoration: none;
    color: var(--glow);
    display: block;
  }

  .level-thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border: 1px solid var(--panel-border);
    background: #060a04;
  }

  .level-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: brightness(0.85) saturate(0.9);
    transition: filter 0.4s ease, transform 6s ease;
  }

  .level-card:hover .level-thumb img {
    filter: brightness(1.05) saturate(1);
    transform: scale(1.04);
  }

  .level-thumb::after {
    content: '';
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.55);
    pointer-events: none;
  }

  .level-number {
    position: absolute;
    top: 10px;
    left: 14px;
    font-size: 13px;
    letter-spacing: 0.05em;
    color: var(--glow-dim);
    z-index: 2;
    opacity: 0.75;
    transition: opacity 0.3s ease, color 0.3s ease;
  }

  .level-card:hover .level-number {
    opacity: 1;
    color: var(--glow);
  }

  .final-row {
    margin-top: 36px;
    display: flex;
    justify-content: center;
  }

  .level-card.final-card {
    width: 480px;
    .final-card.locked {
  opacity: 0.35;
  filter: grayscale(40%);
  pointer-events: none;
  cursor: default;
}
  }

  .level-card.final-card .level-thumb {
    border-color: rgba(217, 232, 122, 0.32);
  }

  .level-card.final-card .level-number {
    font-size: 12px;
    letter-spacing: 0.1em;
  }

  @media (max-width: 700px) {
    .levels { gap: 24px; }
    .level-card { width: min(86vw, 320px); }
    .level-card.final-card { width: min(94vw, 480px); }
    h1 { font-size: 14px; margin-bottom: 40px; }
  }
</style>
</head>
<body>

  <h1>Find the Archive</h1>

  <div class="levels">

    <a class="level-card" href="level-1/index.html">
      <div class="level-thumb">
        <span class="level-number">1.</span>
        <img src="thumbs/level1.png" alt="Entrance to the first archive site">
      </div>
    </a>

    <a class="level-card" href="level-2/index.html">
      <div class="level-thumb">
        <span class="level-number">2.</span>
        <img src="thumbs/level2.png" alt="Entrance to the second archive site">
      </div>
    </a>

    <a class="level-card" href="level-3/index.html">
      <div class="level-thumb">
        <span class="level-number">3.</span>
        <img src="thumbs/level3.png" alt="Entrance to the third archive site">
      </div>
    </a>

    <a class="level-card" href="level-4/index.html">
      <div class="level-thumb">
        <span class="level-number">4.</span>
        <img src="thumbs/level4.png" alt="Entrance to the fourth archive site">
      </div>
    </a>

  </div>

  <div class="final-row">
    <a class="level-card final-card" href="level-5/index.html">
      <div class="level-thumb">
        <span class="level-number">The Archive.</span>
        <img src="thumbs/level5.png" alt="Entrance to the final archive site">
      </div>
    </a>
  </div>
  
<script>
  const allComplete =
    localStorage.getItem('level-1-complete') === 'true' &&
    localStorage.getItem('level-2-complete') === 'true' &&
    localStorage.getItem('level-3-complete') === 'true' &&
    localStorage.getItem('level-4-complete') === 'true';

  if (!allComplete) {
    const card = document.getElementById('final-card');
    card.classList.add('locked');
    card.removeAttribute('href');
    card.style.cursor = 'default';
  }
</script>
  
</body>
</html>
