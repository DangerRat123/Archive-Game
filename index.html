<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Archive</title>
<style>
  :root {
    --ink: #0d1f0a;
    --glow: #d9e87a;
    --glow-dim: #8fae4a;
    --panel-bg: rgba(8, 16, 6, 0.88);
    --panel-border: rgba(217, 232, 122, 0.25);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #050a04;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28"><circle cx="14" cy="14" r="3" fill="%23d9e87a"/><circle cx="14" cy="14" r="9" fill="none" stroke="%23d9e87a" stroke-width="1" opacity="0.6"/></svg>') 14 14, auto;
  }

  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #050a04;
  }

  .scene {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: none;
  }

  .scene.active { display: block; }

  .scene img.bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    user-select: none;
    -webkit-user-drag: none;
    filter: brightness(1.0);
    transition: filter 0.3s ease;
  }

  .hotspot {
    position: absolute;
    cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><circle cx="16" cy="16" r="4" fill="%23f4ffb8"/><circle cx="16" cy="16" r="12" fill="none" stroke="%23f4ffb8" stroke-width="1.5"/><circle cx="16" cy="16" r="12" fill="none" stroke="%23f4ffb8" stroke-width="0.5" opacity="0.4"><animate attributeName="r" values="12;16;12" dur="1.6s" repeatCount="indefinite"/></circle></svg>') 16 16, pointer;
    z-index: 5;
  }

  .hotspot.door {
    animation: pulse-door 2.6s ease-in-out infinite;
  }

  @keyframes pulse-door {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.35); }
  }

  /* visible debug rectangle - remove or keep faint for production */
  .hotspot::after {
    content: '';
    position: absolute;
    inset: 0;
  }

  .object-hotspot {
    position: absolute;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    z-index: 5;
    cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><circle cx="16" cy="16" r="4" fill="%23f4ffb8"/><circle cx="16" cy="16" r="12" fill="none" stroke="%23f4ffb8" stroke-width="1.5"/></svg>') 16 16, pointer;
  }

  .object-hotspot .ring {
    position: absolute;
    inset: 0;
    border: 1px solid var(--glow-dim);
    border-radius: 50%;
    opacity: 0.55;
    animation: breathe 3s ease-in-out infinite;
  }

  .object-hotspot.found .ring {
    opacity: 0.18;
    animation: none;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(0.85); opacity: 0.35; }
    50% { transform: scale(1.05); opacity: 0.7; }
  }

  /* Bottom text box */
  #textbox {
    position: absolute;
    left: 50%;
    bottom: 36px;
    transform: translateX(-50%) translateY(12px);
    width: min(720px, 86vw);
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 22px 26px;
    color: var(--glow);
    font-size: 15px;
    line-height: 1.6;
    letter-spacing: 0.02em;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease, transform 0.35s ease;
    z-index: 20;
    backdrop-filter: blur(2px);
  }

  #textbox.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
    pointer-events: auto;
  }

  #textbox .label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--glow-dim);
    margin-bottom: 8px;
  }

  #textbox .close-hint {
    display: block;
    margin-top: 14px;
    font-size: 10px;
    color: var(--glow-dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.7;
  }

  /* Intro hint */
  #hint {
    position: absolute;
    top: 36px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--glow-dim);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.8;
    z-index: 15;
    text-align: center;
    transition: opacity 0.6s ease;
  }

  #hint.hidden { opacity: 0; }

  /* fine grain overlay to match the dithered art style */
  #grain {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 30;
    opacity: 0.05;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/></filter><rect width="100" height="100" filter="url(%23n)"/></svg>');
    mix-blend-mode: overlay;
  }

  @media (max-width: 640px) {
    #textbox { font-size: 13px; padding: 16px 18px; bottom: 20px; width: 92vw; }
    #hint { font-size: 9px; top: 20px; }
  }
</style>
</head>
<body>

<div id="stage">

  <!-- SCENE 1: Entrance -->
  <div class="scene active" data-scene="entrance">
    <img class="bg" src="images/01.png" alt="A distant structure on a ridge, a sliver of light within it">
    <div class="hotspot door" data-target="path"
         style="left: 29.5%; top: 35.5%; width: 8.5%; height: 23%;"
         onclick="goToScene('path')"></div>
  </div>

  <!-- SCENE 2: Path -->
  <div class="scene" data-scene="path">
    <img class="bg" src="images/02.png" alt="Closer now, the doorway of light fills the frame">
    <div class="hotspot door" data-target="final"
         style="left: 39.7%; top: 18.8%; width: 15.9%; height: 48%;"
         onclick="goToScene('final')"></div>
  </div>

  <!-- SCENE 3: Final room -->
  <div class="scene" data-scene="final">
    <img class="bg" src="images/03.png" alt="Inside the light, a corridor of pale green leading inward">

    <div class="object-hotspot" data-id="obj1" style="left: 41%; top: 58%;" onclick="showText('obj1', this)">
      <div class="ring"></div>
    </div>
    <div class="object-hotspot" data-id="obj2" style="left: 22%; top: 70%;" onclick="showText('obj2', this)">
      <div class="ring"></div>
    </div>
    <div class="object-hotspot" data-id="obj3" style="left: 65%; top: 88%;" onclick="showText('obj3', this)">
      <div class="ring"></div>
    </div>
  </div>

  <div id="hint">click the light</div>

  <div id="textbox">
    <span class="label">— archive —</span>
    <span id="textbox-content"></span>
    <span class="close-hint">click anywhere to close</span>
  </div>

  <div id="grain"></div>
</div>

<script>
  const stories = {
    obj1: "Placeholder fragment one. This is where the first object's story text will go once written.",
    obj2: "Placeholder fragment two. This is where the second object's story text will go once written.",
    obj3: "Placeholder fragment three. This is where the third object's story text will go once written."
  };

  const foundObjects = new Set();

  function goToScene(name) {
    document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
    document.querySelector(`.scene[data-scene="${name}"]`).classList.add('active');
    hideText();
    const hint = document.getElementById('hint');
    if (name === 'final') {
      hint.textContent = 'click to examine';
      hint.classList.remove('hidden');
      setTimeout(() => hint.classList.add('hidden'), 2600);
    } else {
      hint.classList.add('hidden');
    }
  }

  function showText(id, el) {
    const box = document.getElementById('textbox');
    const content = document.getElementById('textbox-content');
    content.textContent = stories[id] || '';
    box.classList.add('visible');
    foundObjects.add(id);
    el.classList.add('found');
  }

  function hideText() {
    document.getElementById('textbox').classList.remove('visible');
  }

  document.getElementById('stage').addEventListener('click', (e) => {
    if (e.target.closest('.object-hotspot') || e.target.closest('.hotspot')) return;
    if (e.target.closest('#textbox')) { hideText(); return; }
    hideText();
  });

  // initial hint fade
  setTimeout(() => document.getElementById('hint').classList.add('hidden'), 3200);
</script>

</body>
</html>
